spring.application.name=vehicle-rental-backend

server.port=8080


# =========================================================
# MYSQL DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://127.0.0.1:3307/vehiclehub
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# =========================================================
# FILE UPLOAD
# STEP 2 - VEHICLE PHOTOS & VIDEOS
# =========================================================

spring.servlet.multipart.enabled=true

# Maximum size of ONE uploaded file
spring.servlet.multipart.max-file-size=100MB

# Maximum size of the COMPLETE multipart request
spring.servlet.multipart.max-request-size=200MB
