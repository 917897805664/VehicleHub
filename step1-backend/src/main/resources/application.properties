spring.application.name=vehicle-rental-backend
server.port=8080

# ---------- MySQL (your local Windows MySQL install) ----------
# createDatabaseIfNotExist=true means you don't have to manually create the DB in MySQL Workbench
#spring.datasource.url=jdbc:mysql://localhost:3306/vehicle_rental_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/vehiclehub
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ddl-auto=update -> Hibernate creates/updates the "users" table automatically from User.java
# You do NOT need to write any CREATE TABLE SQL yourself for this step
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
